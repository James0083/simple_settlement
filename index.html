<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>정산서 - 모임 비용 자동 정산</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin="anonymous" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" />
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo, useRef } = React;

const FONT_IMPORT = `
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
`;

const won = (n) => Math.round(n).toLocaleString("ko-KR");

function uid() {
  return Math.random().toString(36).slice(2, 9);
}

// iOS/Android 휴대폰에서만 true. 맥/윈도우 데스크톱, 아이패드 등은 false로 취급해
// 공유 시트 대신 곧바로 파일 다운로드가 되도록 한다.
function isPhoneDevice() {
  if (typeof navigator === "undefined") return false;
  return /iPhone|Android/i.test(navigator.userAgent);
}

function makeParticipant(name = "") {
  return { id: uid(), name };
}

// 채무자 각각이 채권자 각각에게 "받을 금액에 비례"해서 나눠 보내도록 계산.
// -> 한 사람에게 정산이 몰리지 않고, 여러 채무자가 비슷한 구조로 나눠 보내게 됨.
function computeFairTransactionsFromBalances(balances) {
  const creditors = balances.filter((p) => p.balance > 0.5);
  const debtors = balances
    .filter((p) => p.balance < -0.5)
    .map((p) => ({ name: p.name, debt: -p.balance }));

  if (creditors.length === 0 || debtors.length === 0) return [];

  const totalCredit = creditors.reduce((s, c) => s + c.balance, 0);

  const entries = [];
  debtors.forEach((d) => {
    creditors.forEach((c) => {
      const raw = (d.debt * c.balance) / totalCredit;
      entries.push({ from: d.name, to: c.name, raw, floor: Math.floor(raw) });
    });
  });

  const sumFloor = entries.reduce((s, e) => s + e.floor, 0);
  const targetTotal = Math.round(totalCredit);
  const diff = targetTotal - sumFloor;

  const order = entries
    .map((e, idx) => ({ idx, remainder: e.raw - e.floor }))
    .sort((a, b) => b.remainder - a.remainder);

  for (let i = 0; i < diff && i < order.length; i++) {
    entries[order[i].idx].floor += 1;
  }

  return entries
    .filter((e) => e.floor > 0)
    .map((e) => ({ from: e.from, to: e.to, amount: e.floor }));
}

function SettlementApp() {
  const initialParticipants = useMemo(
    () => [makeParticipant(), makeParticipant(), makeParticipant()],
    []
  );
  const [participants, setParticipants] = useState(initialParticipants);
  const [rounds, setRounds] = useState(() => [
    {
      id: uid(),
      title: "",
      payerId: "",
      amount: "",
      participantIds: initialParticipants.map((p) => p.id),
    },
  ]);
  const [calculated, setCalculated] = useState(false);
  const [calcDate, setCalcDate] = useState("");
  const [copied, setCopied] = useState(false);
  const [downloading, setDownloading] = useState(false);
  const resultRef = useRef(null);
  const captureRef = useRef(null);

  const updateParticipantName = (id, name) => {
    setCalculated(false);
    setParticipants((prev) => prev.map((p) => (p.id === id ? { ...p, name } : p)));
  };

  const addParticipant = () => {
    setCalculated(false);
    setParticipants((prev) => [...prev, makeParticipant()]);
  };

  const removeParticipant = (id) => {
    setCalculated(false);
    setParticipants((prev) => prev.filter((p) => p.id !== id));
    setRounds((prev) =>
      prev.map((r) => ({
        ...r,
        payerId: r.payerId === id ? "" : r.payerId,
        participantIds: r.participantIds.filter((pid) => pid !== id),
      }))
    );
  };

  const addRound = () => {
    setCalculated(false);
    setRounds((prev) => [
      ...prev,
      {
        id: uid(),
        title: "",
        payerId: "",
        amount: "",
        participantIds: participants.map((p) => p.id),
      },
    ]);
  };

  const updateRound = (id, field, value) => {
    setCalculated(false);
    setRounds((prev) => prev.map((r) => (r.id === id ? { ...r, [field]: value } : r)));
  };

  const removeRound = (id) => {
    setCalculated(false);
    setRounds((prev) => prev.filter((r) => r.id !== id));
  };

  const toggleRoundParticipant = (roundId, participantId) => {
    setCalculated(false);
    setRounds((prev) =>
      prev.map((r) => {
        if (r.id !== roundId) return r;
        const has = r.participantIds.includes(participantId);
        return {
          ...r,
          participantIds: has
            ? r.participantIds.filter((id) => id !== participantId)
            : [...r.participantIds, participantId],
        };
      })
    );
  };

  const toggleAllRoundParticipants = (roundId) => {
    setCalculated(false);
    setRounds((prev) =>
      prev.map((r) => {
        if (r.id !== roundId) return r;
        const allIds = participants.filter((p) => p.name.trim()).map((p) => p.id);
        const allSelected = allIds.length > 0 && allIds.every((id) => r.participantIds.includes(id));
        return { ...r, participantIds: allSelected ? [] : allIds };
      })
    );
  };

  const validParticipants = useMemo(
    () => participants.filter((p) => p.name.trim().length > 0),
    [participants]
  );
  const validParticipantIdSet = useMemo(
    () => new Set(validParticipants.map((p) => p.id)),
    [validParticipants]
  );

  const isAllSelected = (r) =>
    validParticipants.length > 0 && validParticipants.every((p) => r.participantIds.includes(p.id));

  const stats = useMemo(() => {
    const map = new Map();
    validParticipants.forEach((p) => map.set(p.id, { id: p.id, name: p.name.trim(), paid: 0, share: 0 }));

    rounds.forEach((r) => {
      const amount = parseFloat(r.amount) || 0;
      if (amount <= 0) return;
      if (!validParticipantIdSet.has(r.payerId)) return;
      const activeIds = r.participantIds.filter((id) => validParticipantIdSet.has(id));
      if (activeIds.length === 0) return;

      map.get(r.payerId).paid += amount;
      const share = amount / activeIds.length;
      activeIds.forEach((id) => {
        map.get(id).share += share;
      });
    });

    return Array.from(map.values()).map((s) => ({ ...s, balance: s.paid - s.share }));
  }, [validParticipants, validParticipantIdSet, rounds]);

  const validRoundsCount = useMemo(
    () =>
      rounds.filter((r) => {
        const amount = parseFloat(r.amount) || 0;
        return (
          amount > 0 &&
          validParticipantIdSet.has(r.payerId) &&
          r.participantIds.filter((id) => validParticipantIdSet.has(id)).length > 0
        );
      }).length,
    [rounds, validParticipantIdSet]
  );

  const totalAmount = useMemo(() => stats.reduce((s, p) => s + p.paid, 0), [stats]);

  const flatTransactions = useMemo(() => {
    if (!calculated) return [];
    return computeFairTransactionsFromBalances(stats);
  }, [calculated, stats]);

  const groupedTransactions = useMemo(() => {
    const order = [];
    const map = new Map();
    flatTransactions.forEach((t) => {
      if (!map.has(t.from)) {
        map.set(t.from, []);
        order.push(t.from);
      }
      map.get(t.from).push(t);
    });
    return order.map((from) => {
      const items = map.get(from);
      return { from, items, subtotal: items.reduce((s, i) => s + i.amount, 0) };
    });
  }, [flatTransactions]);

  const canCalculate = validParticipants.length >= 2 && validRoundsCount >= 1;

  const handleCalculate = () => {
    if (!canCalculate) return;
    setCalculated(true);
    setCalcDate(new Date().toLocaleDateString("ko-KR"));
    setTimeout(() => {
      resultRef.current?.scrollIntoView({ behavior: "smooth", block: "start" });
    }, 50);
  };

  const handleCopy = async () => {
    const lines = ["정산 결과"];
    stats.forEach((s) => {
      const sign = s.balance > 0.5 ? "+" : "";
      lines.push(`${s.name}  낸 금액 ${won(s.paid)}원 / 부담 ${won(s.share)}원 / 차액 ${sign}${won(s.balance)}원`);
    });
    lines.push("");
    groupedTransactions.forEach((g) => {
      lines.push(`${g.from} (총 ${won(g.subtotal)}원)`);
      g.items.forEach((i) => lines.push(`  → ${i.to}  ${won(i.amount)}원`));
    });
    const text = lines.join("\n");
    try {
      await navigator.clipboard.writeText(text);
      setCopied(true);
      setTimeout(() => setCopied(false), 1800);
    } catch (e) {
      setCopied(false);
    }
  };

  const canvasToBlob = (canvas) =>
    new Promise((resolve) => canvas.toBlob((blob) => resolve(blob), "image/png"));

  const handleDownloadImage = async () => {
    if (!captureRef.current) return;
    setDownloading(true);
    try {
      const canvas = await html2canvas(captureRef.current, { backgroundColor: "#FFFFFF", scale: 2 });
      const blob = await canvasToBlob(canvas);
      if (!blob) return;

      const file = new File([blob], "정산결과.png", { type: "image/png" });

      // 아이폰·안드로이드에서만 공유 시트를 띄워 "사진 앱에 저장"이 가능하게 하고,
      // 그 외(맥/윈도우 등 데스크톱)에서는 항상 파일 다운로드로 처리한다.
      const canUseShareSheet =
        isPhoneDevice() && navigator.canShare && navigator.canShare({ files: [file] });

      if (canUseShareSheet) {
        try {
          await navigator.share({ files: [file], title: "정산결과" });
        } catch (shareErr) {
          // 사용자가 공유를 취소한 경우 등은 무시
        }
      } else {
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.download = "정산결과.png";
        link.href = url;
        link.click();
        URL.revokeObjectURL(url);
      }
    } catch (err) {
      console.error(err);
    } finally {
      setDownloading(false);
    }
  };

  return (
    <div style={styles.page}>
      <style>{`
        ${FONT_IMPORT}
        * { box-sizing: border-box; }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        .settle-name-input:focus, .settle-amount-input:focus { outline: none; background: #F3F6FB; }
        .settle-select:focus { outline: none; border-color: #1A1D29; }
        .settle-remove-btn:hover { opacity: 1; }
        .settle-add-btn:hover { background: #1A1D29; color: #FFFFFF; border-color: #1A1D29; }
        .settle-calc-btn:hover { transform: translateY(-1px); box-shadow: 3px 5px 0 #B8391F; }
        .settle-calc-btn:active { transform: translateY(1px); box-shadow: 1px 2px 0 #B8391F; }
        .settle-copy-btn:hover { background: #0C6B4E; }
        .settle-download-btn:hover { background: #0F1218; }
        .settle-chip-inactive:hover { border-color: #9AA0B0; color: #5C6178; }
        .settle-chip-active:hover { opacity: 0.85; }
        .settle-footer-link:hover { color: #5C6178; text-decoration: underline; }
        @media (prefers-reduced-motion: reduce) { .settle-stamp { animation: none !important; } }
        @keyframes stampIn {
          0% { opacity: 0; transform: rotate(-8deg) scale(1.6); }
          60% { opacity: 1; transform: rotate(-8deg) scale(0.92); }
          100% { opacity: 1; transform: rotate(-8deg) scale(1); }
        }
      `}</style>

      <div style={styles.receipt}>
        <div style={styles.zigzagTop} aria-hidden="true" />

        <div style={styles.inner}>
          <header style={styles.header}>
            <div style={styles.eyebrowLine} aria-hidden="true" />
            <h1 style={styles.title}>정산서</h1>
            <p style={styles.subtitle}>회차별로 결제자와 참여자를 나눠 입력하면, 자동으로 정산해드려요</p>
          </header>

          <section style={styles.section}>
            <div style={styles.sectionLabel}>참가자</div>
            <div style={styles.peopleList}>
              {participants.map((p) => (
                <div key={p.id} style={styles.personRow}>
                  <input
                    className="settle-name-input"
                    style={styles.nameInputFull}
                    type="text"
                    placeholder="이름"
                    value={p.name}
                    onChange={(e) => updateParticipantName(p.id, e.target.value)}
                  />
                  <button
                    className="settle-remove-btn"
                    style={styles.removeBtn}
                    onClick={() => removeParticipant(p.id)}
                    aria-label={`${p.name || "참가자"} 삭제`}
                  >
                    ✕
                  </button>
                </div>
              ))}
            </div>
            <button className="settle-add-btn" style={styles.addBtn} onClick={addParticipant}>
              + 참가자 추가
            </button>
          </section>

          <div style={styles.dashedDivider} aria-hidden="true" />

          <section style={styles.section}>
            <div style={styles.sectionLabel}>회차</div>
            <div style={styles.roundsList}>
              {rounds.map((r, idx) => (
                <div key={r.id} style={styles.roundCard}>
                  <div style={styles.roundTopRow}>
                    <input
                      className="settle-name-input"
                      style={styles.roundTitleInput}
                      type="text"
                      placeholder={`정산 이름 (예: ${idx + 1}차)`}
                      value={r.title}
                      onChange={(e) => updateRound(r.id, "title", e.target.value)}
                    />
                    <button
                      className="settle-remove-btn"
                      style={styles.removeBtn}
                      onClick={() => removeRound(r.id)}
                      aria-label="회차 삭제"
                    >
                      ✕
                    </button>
                  </div>

                  <div style={styles.roundFieldRow}>
                    <select
                      className="settle-select"
                      style={styles.selectInput}
                      value={r.payerId}
                      onChange={(e) => updateRound(r.id, "payerId", e.target.value)}
                    >
                      <option value="">결제한 사람</option>
                      {validParticipants.map((p) => (
                        <option key={p.id} value={p.id}>
                          {p.name.trim()}
                        </option>
                      ))}
                    </select>
                    <div style={styles.amountWrap}>
                      <input
                        className="settle-amount-input"
                        style={styles.amountInput}
                        type="number"
                        inputMode="numeric"
                        placeholder="0"
                        value={r.amount}
                        onChange={(e) => updateRound(r.id, "amount", e.target.value)}
                      />
                      <span style={styles.wonSuffix}>원</span>
                    </div>
                  </div>

                  <div style={styles.roundChipHeadRow}>
                    <span style={styles.roundChipLabel}>참여한 사람</span>
                    <button
                      type="button"
                      style={styles.roundToggleAllBtn}
                      onClick={() => toggleAllRoundParticipants(r.id)}
                    >
                      {isAllSelected(r) ? "전체 해제" : "전체 선택"}
                    </button>
                  </div>
                  <div style={styles.chipRow}>
                    {validParticipants.length === 0 ? (
                      <span style={styles.chipEmptyHint}>참가자 이름을 먼저 입력해주세요</span>
                    ) : (
                      validParticipants.map((p) => {
                        const active = r.participantIds.includes(p.id);
                        return (
                          <button
                            key={p.id}
                            type="button"
                            className={active ? "settle-chip-active" : "settle-chip-inactive"}
                            style={{ ...styles.chip, ...(active ? styles.chipActive : styles.chipInactive) }}
                            onClick={() => toggleRoundParticipant(r.id, p.id)}
                          >
                            {p.name.trim()}
                          </button>
                        );
                      })
                    )}
                  </div>
                </div>
              ))}
            </div>
            <button className="settle-add-btn" style={styles.addBtn} onClick={addRound}>
              + 회차 추가
            </button>
          </section>

          <div style={styles.dashedDivider} aria-hidden="true" />

          <section style={styles.summaryBlock}>
            <div style={styles.summaryRow}>
              <span style={styles.summaryLabel}>참가 인원</span>
              <span style={styles.summaryValue}>{validParticipants.length}명</span>
            </div>
            <div style={styles.summaryRow}>
              <span style={styles.summaryLabel}>정산 회차</span>
              <span style={styles.summaryValue}>{validRoundsCount}건</span>
            </div>
            <div style={styles.summaryRow}>
              <span style={styles.summaryLabel}>총 사용 금액</span>
              <span style={{ ...styles.summaryValue, color: "#E8503A" }}>{won(totalAmount)}원</span>
            </div>
          </section>

          <button
            className="settle-calc-btn"
            style={{ ...styles.calcBtn, opacity: canCalculate ? 1 : 0.45, cursor: canCalculate ? "pointer" : "not-allowed" }}
            onClick={handleCalculate}
            disabled={!canCalculate}
          >
            정산 계산하기
          </button>
          {!canCalculate && (
            <p style={styles.hint}>
              참가자 2명 이상, 결제자·금액·참여자를 모두 입력한 회차가 1개 이상이어야 계산할 수 있어요.
            </p>
          )}

          {calculated && (
            <div ref={resultRef}>
              <div style={styles.dashedDivider} aria-hidden="true" />

              <div ref={captureRef} style={styles.captureWrap}>
                <div style={styles.captureTitleRow}>
                  <span style={styles.captureTitleText}>정산서</span>
                  <span className="settle-stamp" style={styles.stamp}>정산 완료</span>
                </div>
                <p style={styles.captureDate}>{calcDate}</p>

                <div style={styles.statsBlock}>
                  <div style={styles.statsSubLabel}>사람별 결제 내역</div>
                  <div style={styles.statsHeadRow}>
                    <span style={{ ...styles.statsCell, flex: 1.1 }}>이름</span>
                    <span style={{ ...styles.statsCell, flex: 1, textAlign: "right" }}>낸 금액</span>
                    <span style={{ ...styles.statsCell, flex: 1, textAlign: "right" }}>부담액</span>
                    <span style={{ ...styles.statsCell, flex: 1, textAlign: "right" }}>차액</span>
                  </div>
                  {stats.map((s) => (
                    <div key={s.id} style={styles.statsRow}>
                      <span style={{ ...styles.statsName, flex: 1.1 }}>{s.name}</span>
                      <span style={{ ...styles.statsNum, flex: 1 }}>{won(s.paid)}원</span>
                      <span style={{ ...styles.statsNum, flex: 1 }}>{won(s.share)}원</span>
                      <span
                        style={{
                          ...styles.statsNum,
                          flex: 1,
                          fontWeight: 700,
                          color: s.balance > 0.5 ? "#0F9D64" : s.balance < -0.5 ? "#E8503A" : "#9AA0B0",
                        }}
                      >
                        {s.balance > 0.5 ? "+" : ""}
                        {won(s.balance)}원
                      </span>
                    </div>
                  ))}
                </div>

                <div style={styles.dashedDivider} aria-hidden="true" />

                <div style={styles.statsSubLabel}>정산 결과</div>
                <p style={styles.groupHint}>보내는 사람별로 묶어서 보여드려요</p>

                {groupedTransactions.length === 0 ? (
                  <p style={styles.evenText}>정산할 차액이 없어요.</p>
                ) : (
                  <div style={styles.groupList}>
                    {groupedTransactions.map((g, gi) => (
                      <div key={gi} style={styles.groupCard}>
                        <div style={styles.groupHeadRow}>
                          <span style={styles.groupFrom}>{g.from}</span>
                          <span style={styles.groupSubtotal}>총 {won(g.subtotal)}원</span>
                        </div>
                        <ul style={styles.txList}>
                          {g.items.map((t, i) => (
                            <li key={i} style={styles.txRow}>
                              <span style={styles.txArrow}>→</span>
                              <span style={styles.txTo}>{t.to}</span>
                              <span style={styles.txAmount}>{won(t.amount)}원</span>
                            </li>
                          ))}
                        </ul>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              <div style={styles.actionRow}>
                <button className="settle-copy-btn" style={styles.copyBtn} onClick={handleCopy}>
                  {copied ? "복사됐어요" : "결과 복사하기"}
                </button>
                <button
                  className="settle-download-btn"
                  style={{ ...styles.downloadBtn, opacity: downloading ? 0.6 : 1, cursor: downloading ? "not-allowed" : "pointer" }}
                  onClick={handleDownloadImage}
                  disabled={downloading}
                >
                  {downloading ? "이미지 생성 중..." : "이미지로 저장"}
                </button>
              </div>
            </div>
          )}
        </div>

        <div style={styles.zigzagBottom} aria-hidden="true" />
      </div>

      <footer style={styles.footer}>
        <a className="settle-footer-link" href="privacy.html" style={styles.footerLink}>
          개인정보처리방침
        </a>
        <span style={styles.footerDot}>·</span>
        <a className="settle-footer-link" href="terms.html" style={styles.footerLink}>
          이용약관
        </a>
        <span style={styles.footerDot}>·</span>
        <a className="settle-footer-link" href="contact.html" style={styles.footerLink}>
          문의하기
        </a>
      </footer>
    </div>
  );
}

const zigzag = (flip) => ({
  height: 14,
  background: `linear-gradient(${flip ? -135 : 135}deg, #FFFFFF 8px, transparent 0), linear-gradient(${flip ? 135 : -135}deg, #FFFFFF 8px, transparent 0)`,
  backgroundSize: "16px 16px",
  backgroundPosition: "left top",
  backgroundColor: "transparent",
