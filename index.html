<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>딱정산 - 모임 비용 자동 정산</title>
<meta name="description" content="모임 비용을 회차별로 나눠 자동으로 정산해주는 무료 도구" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#EEF1F4" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="딱정산" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin="anonymous" />
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin="anonymous" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" crossorigin href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" />

<!--
  번들러 없음. 앱 소스는 src/ 아래 표준 ES 모듈(import/export)이고, index.html 은
  진입점 src/main.js 하나만 로드한다. 브라우저 네이티브 모듈 로더가 나머지를 해석한다.
  vendor(React·htm·html2canvas)는 아래 import map 으로 jsdelivr ESM 을 가리킨다.
  JSX 대신 htm(태그드 템플릿)을 쓰므로 트랜스파일러가 필요 없다.
-->
<script type="importmap">
{
  "imports": {
    "react": "https://cdn.jsdelivr.net/npm/react@18.3.1/+esm",
    "react-dom/client": "https://cdn.jsdelivr.net/npm/react-dom@18.3.1/client/+esm",
    "htm": "https://cdn.jsdelivr.net/npm/htm@3.1.1/+esm",
    "html2canvas": "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/+esm"
  }
}
</script>

<style>
  html, body { margin: 0; padding: 0; }
  #root { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }

  /* 앱 전역 CSS — 인라인 스타일로는 표현하기 어려운 :focus / :hover / 키프레임 */
  * { box-sizing: border-box; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; }
  .settle-name-input:focus, .settle-amount-input:focus { outline: none; background: #F3F6FB; }
  .settle-select:focus { outline: none; border-color: #1A1D29; }
  .settle-remove-btn:hover { opacity: 1; }
  .settle-add-btn:hover { background: #1A1D29; color: #FFFFFF; border-color: #1A1D29; }
  .settle-calc-btn:hover { transform: translateY(-1px); box-shadow: 3px 5px 0 #B8391F; }
  .settle-calc-btn:active { transform: translateY(1px); box-shadow: 1px 2px 0 #B8391F; }
  .settle-copy-btn:hover { background: #0C6B4E; }
  .settle-download-btn:hover { background: #0F1218; }
  .settle-chip-inactive:hover { border-color: #9AA0B0; color: #5C6178; }
  .settle-chip-active:hover { opacity: 0.85; }
  .settle-footer-link:hover { color: #5C6178; text-decoration: underline; }
  @media (prefers-reduced-motion: reduce) { .settle-stamp { animation: none !important; } }
  @keyframes stampIn {
    0% { opacity: 0; transform: rotate(-8deg) scale(1.6); }
    60% { opacity: 1; transform: rotate(-8deg) scale(0.92); }
    100% { opacity: 1; transform: rotate(-8deg) scale(1); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="module" src="src/main.js"></script>

<script>
  // PWA: 서비스 워커 등록 (오프라인 지원 · 홈 화면 설치)
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
