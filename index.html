    <p>딱정산은 모임 비용을 1차·2차·3차 회차별로 나눠 기록하면, 사람마다 낸 돈과 부담할 돈을 계산하고
      누가 누구에게 얼마를 보내면 되는지 알려주는 무료 웹앱입니다. 회차마다 참여한 사람이 달라도 참여한 사람끼리만 정확히 나눕니다.</p>
    <p>인원·장르·가격대로 메뉴를 추천하는 "오늘 뭐먹지"와, 룰렛·사다리 타기·폭탄 돌리기 등 오늘 낼 사람을 정하는 미니게임도 함께 쓸 수 있습니다.
