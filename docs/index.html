<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>딱정산 - 주소가 변경되었습니다</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #EEF1F4;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .card {
      background: #fff; padding: 40px 32px; max-width: 400px; width: 90%;
      box-shadow: 0 18px 40px rgba(26,29,41,0.12), 0 2px 0 rgba(26,29,41,0.04);
      text-align: center;
    }
    .emoji { font-size: 36px; margin-bottom: 12px; }
    h1 { font-size: 20px; font-weight: 800; margin: 0 0 10px; color: #1A1D29; letter-spacing: -0.3px; }
    p  { font-size: 14px; color: #5C6178; line-height: 1.7; margin: 0 0 20px; }
    .steps {
      text-align: left; margin: 0 0 20px;
      font-size: 14px; color: #5C6178; line-height: 1.8;
      padding: 0; list-style: none;
    }
    .steps li { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 6px; }
    .steps .num {
      flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%;
      background: #1A1D29; color: #fff;
      font-size: 11px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      margin-top: 2px;
    }
    .url-row {
      display: flex; align-items: center; gap: 8px; margin: 0 0 20px;
    }
    .url-box {
      flex: 1;
      background: #EEF1F4; border-radius: 4px;
      padding: 12px 14px;
      font-size: 13px; font-weight: 700; color: #1A1D29;
      word-break: break-all; letter-spacing: -0.2px;
      text-align: left;
    }
    .copy-btn {
      flex-shrink: 0;
      width: 40px; height: 44px;
      background: #EEF1F4; border: none; border-radius: 4px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
      position: relative;
    }
    .copy-btn:hover { background: #DDE1E8; }
    .copy-btn.copied { background: #0F9D64; }
    .copy-btn.copied svg path,
    .copy-btn.copied svg rect { stroke: #fff; }
    .copy-tip {
      position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
      background: #1A1D29; color: #fff; font-size: 11px; white-space: nowrap;
      padding: 4px 8px; border-radius: 3px; pointer-events: none;
      opacity: 0; transition: opacity 0.15s;
    }
    .copy-btn.copied .copy-tip { opacity: 1; }
    .browser-btns { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    a.browser-btn {
      display: flex; align-items: center; gap: 10px;
      padding: 13px 18px; border-radius: 4px;
      text-decoration: none; font-size: 14px; font-weight: 600;
      background: #1A1D29; color: #fff;
      transition: opacity 0.15s;
    }
    a.browser-btn:hover { opacity: 0.85; }
    a.browser-btn .icon { width: 22px; height: 22px; flex-shrink: 0; }
    a.browser-btn .label { flex: 1; text-align: left; }
    a.browser-btn .sub { font-size: 11px; font-weight: 400; opacity: 0.6; }
    .divider {
      font-size: 11px; color: #C7CCD8; margin: 4px 0 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #DDE1E8; }
    a.btn-plain { display: inline-block; color: #9AA0B0; font-size: 13px; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🔔</div>
    <h1>딱정산이 새 주소로 이동했습니다</h1>
    <p>기존 앱을 삭제하고 새 주소에서 다시 설치하면<br>뭐먹지·미니게임 탭을 포함한<br>최신 버전으로 더 편하게 이용할 수 있어요.</p>
    <ol class="steps">
      <li><span class="num">1</span><span>홈 화면에서 기존 딱정산 앱을 길게 눌러 삭제</span></li>
      <li><span class="num">2</span><span>아래 버튼으로 브라우저를 직접 열기</span></li>
      <li><span class="num">3</span><span>주소창 옆 <strong style="color:#1A1D29">설치</strong> 버튼을 눌러 다시 설치</span></li>
    </ol>
    <div class="url-row">
      <div class="url-box" id="url-display"></div>
      <button class="copy-btn" id="copy-btn" title="주소 복사">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <rect x="6" y="6" width="10" height="10" rx="1.5" stroke="#5C6178" stroke-width="1.5"/>
          <path d="M4 12H3a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v1" stroke="#5C6178" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span class="copy-tip">복사됨!</span>
      </button>
    </div>
    <div class="browser-btns" id="browser-btns"></div>
    <div class="divider" id="divider">또는</div>
    <a class="btn-plain" id="link" href="#" target="_blank">그냥 이동하기 (설치 안 됨)</a>
  </div>
  <script>
    var DEST = 'https://ddakjeongsan.com/';
    var ENC  = encodeURIComponent(DEST);
    var HOST = 'simple-settlement.pages.dev/';

    document.getElementById('link').href = DEST;
    document.getElementById('url-display').textContent = DEST;

    /* 복사 버튼 */
    document.getElementById('copy-btn').addEventListener('click', function () {
      var btn = this;
      navigator.clipboard.writeText(DEST).then(function () {
        btn.classList.add('copied');
        setTimeout(function () { btn.classList.remove('copied'); }, 1800);
      }).catch(function () {
        /* clipboard API 실패 시 execCommand fallback */
        var ta = document.createElement('textarea');
        ta.value = DEST; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        btn.classList.add('copied');
        setTimeout(function () { btn.classList.remove('copied'); }, 1800);
      });
    });

    /* 브라우저 딥링크 */
    var ua = navigator.userAgent;
    var isIOS     = /iPhone|iPad|iPod/.test(ua);
    var isAndroid = /Android/.test(ua);

    var browsers = [];

    if (isIOS) {
      browsers = [
        {
          label: 'Safari에서 열기', sub: '설치 추천',
          href: 'x-safari-https://' + HOST,
          icon: '<svg viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="10" stroke="white" stroke-width="1.5"/><path d="M11 3v1M11 18v1M3 11h1M18 11h1" stroke="white" stroke-width="1.5" stroke-linecap="round"/><path d="M14.5 7.5l-2.8 2.8M7.5 14.5l2.8-2.8" stroke="#E8503A" stroke-width="1.8" stroke-linecap="round"/><circle cx="11" cy="11" r="1.2" fill="white"/></svg>'
        },
        {
          label: 'Chrome에서 열기', sub: '',
          href: 'googlechromes://navigate?url=' + ENC,
          icon: '<svg viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="10" stroke="white" stroke-width="1.5"/><circle cx="11" cy="11" r="4" fill="white"/><circle cx="11" cy="11" r="2.5" fill="#1A1D29"/></svg>'
        }
      ];
    } else if (isAndroid) {
      browsers = [
        {
          label: '브라우저에서 열기', sub: '설치 추천',
          href: 'intent://' + HOST + '#Intent;scheme=https;end;',
          icon: '<svg viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="10" stroke="white" stroke-width="1.5"/><circle cx="11" cy="11" r="4" fill="white"/><circle cx="11" cy="11" r="2.5" fill="#1A1D29"/></svg>'
        }
      ];
    } else {
      browsers = [
        {
          label: '새 주소로 이동하기', sub: '',
          href: DEST,
          icon: '<svg viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="10" stroke="white" stroke-width="1.5"/><path d="M7 11h8M13 8l3 3-3 3" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        }
      ];
      document.getElementById('divider').style.display = 'none';
      document.getElementById('link').style.display = 'none';
    }

    var container = document.getElementById('browser-btns');
    browsers.forEach(function (b) {
      var a = document.createElement('a');
      a.className = 'browser-btn';
      a.href = b.href;
      a.innerHTML =
        '<span class="icon">' + b.icon + '</span>' +
        '<span class="label">' + b.label +
          (b.sub ? '<br><span class="sub">' + b.sub + '</span>' : '') +
        '</span>';
      container.appendChild(a);
    });
  </script>
</body>
</html>
