<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>영수증 OCR 프로토타입 — 딱정산</title>
<!--
  딱정산 · 영수증 이미지 인식 기능 검토용 프로토타입 (앱 본체와 분리)

  Tesseract.js(브라우저 안 OCR)로 한글 영수증에서 매장명·합계 금액·날짜 추정.
  서버 없음, 사진이 기기 밖으로 나가지 않음, GitHub Pages 그대로 배포 가능.

  인식률 개선 포인트:
   - "금액 부분만 손가락으로 드래그" → 그 영역만 확대 + 숫자 화이트리스트로 재인식
   - 국소 이진화(Sauvola) 옵션 — 감열지 조명 얼룩에 강함
   - PSM(레이아웃) / 언어(kor vs kor+eng) 선택
  한글 감열지 특성상 매장명은 여전히 부정확할 수 있음. 실제 정확도 확인용.
-->
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 22px 14px 64px;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    background: #EEF1F4; color: #1A1D29;
    display: flex; flex-direction: column; align-items: center;
  }
  .wrap { width: 100%; max-width: 480px; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  p.sub { margin: 0 0 18px; font-size: 12.5px; color: #5C6178; line-height: 1.6; }
  .card { background: #fff; border: 1px solid #E3E6EC; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
  .card.hidden { display: none; }
  label.field { display: block; font-size: 11.5px; font-weight: 700; color: #8A8FA3; letter-spacing: .5px; margin-bottom: 8px; }
  input[type="file"] { width: 100%; font-size: 13px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; margin-top: 6px; }
  .grid label { font-size: 12px; color: #4B5165; display: flex; flex-direction: column; gap: 4px; }
  select { font-family: inherit; font-size: 13px; padding: 7px 6px; border: 1px solid #DDE1E8; border-radius: 5px; background: #fff; color: #1A1D29; }
  .stage-hint { font-size: 11.5px; color: #9AA0B0; margin: 0 0 8px; }
  .stage-box { position: relative; width: 100%; overflow: hidden; border-radius: 6px; border: 1px solid #E3E6EC; background: #F6F8FB; }
  canvas#stage { display: block; width: 100%; touch-action: none; cursor: crosshair; }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  button {
    flex: 1; padding: 11px 0; border: none; border-radius: 6px; font-family: inherit;
    font-size: 13.5px; font-weight: 700; cursor: pointer;
  }
  button.primary { background: #E8503A; color: #fff; }
  button.ghost { background: #EEF1F4; color: #1A1D29; border: 1px solid #DDE1E8; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .progress { margin-top: 12px; font-size: 12px; color: #5C6178; }
  .bar { height: 6px; background: #E3E6EC; border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; width: 0; background: #0F9D64; transition: width .2s; }
  .result-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .result-row label { flex: 0 0 60px; font-size: 12px; font-weight: 700; color: #8A8FA3; }
  .result-row input {
    flex: 1; min-width: 0; font-size: 15px; padding: 8px 10px;
    border: 1px solid #DDE1E8; border-radius: 5px; background: #F6F8FB; color: #1A1D29; font-family: inherit;
  }
  .result-row .num { font-variant-numeric: tabular-nums; font-weight: 700; }
  details { margin-top: 10px; font-size: 12px; }
  details summary { cursor: pointer; color: #5C6178; font-weight: 600; }
  pre { white-space: pre-wrap; word-break: break-all; background: #F6F8FB; border: 1px solid #E3E6EC; border-radius: 6px; padding: 10px; font-size: 12px; line-height: 1.5; max-height: 300px; overflow: auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { font-variant-numeric: tabular-nums; font-size: 12px; padding: 3px 8px; border-radius: 4px; background: #EEF1F4; border: 1px solid #DDE1E8; cursor: pointer; }
  .chip.pick { background: #E6F7EF; border-color: #0F9D64; color: #0C6B4E; font-weight: 700; }
  .meta { font-size: 11px; color: #9AA0B0; margin-top: 8px; }
  .status { font-size: 11.5px; margin: -5px 0 10px 70px; }
  .status.ok { color: #0C6B4E; }
  .status.warn { color: #E8503A; }
  .status:empty { display: none; }
  @media (prefers-color-scheme: dark) {
    body { background: #14161E; color: #E8EAF0; }
    .card { background: #1C1F29; border-color: #2A2E3A; }
    .result-row input, select { background: #14161E; border-color: #2A2E3A; color: #E8EAF0; }
    pre, .stage-box { background: #14161E; border-color: #2A2E3A; }
    .chip, button.ghost { background: #14161E; border-color: #2A2E3A; color: #E8EAF0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>영수증 OCR 프로토타입</h1>
  <p class="sub">
    영수증 사진을 넣고 <b>금액이 적힌 부분을 손가락으로 드래그</b>한 뒤
    “선택 영역 금액 인식”을 누르면 정확도가 가장 높습니다. 사진은 기기 밖으로
    나가지 않고, 첫 실행 때 한글 데이터(약 10MB)를 한 번 받습니다.
  </p>

  <div class="card">
    <label class="field" for="file">영수증 사진</label>
    <input id="file" type="file" accept="image/*" />
    <div class="grid">
      <label>언어
        <select id="opt-lang">
          <option value="kor+eng">kor + eng</option>
          <option value="kor">kor 만</option>
        </select>
      </label>
      <label>전처리
        <select id="opt-prep">
          <option value="contrast">그레이 + 대비</option>
          <option value="sauvola" selected>Sauvola 이진화</option>
          <option value="otsu">Otsu 이진화</option>
          <option value="none">원본</option>
        </select>
      </label>
      <label>레이아웃(PSM)
        <select id="opt-psm">
          <option value="4">4 · 가변 컬럼</option>
          <option value="6" selected>6 · 균일 블록</option>
          <option value="3">3 · 자동</option>
        </select>
      </label>
      <label>미리보기
        <select id="opt-view">
          <option value="orig">원본</option>
          <option value="prep">전처리 결과</option>
        </select>
      </label>
    </div>
  </div>

  <div class="card hidden" id="stage-card">
    <label class="field">이미지 — 금액 부분을 드래그해서 선택</label>
    <p class="stage-hint" id="stage-hint">선택 없이 “전체 인식”만 눌러도 됩니다.</p>
    <div class="stage-box"><canvas id="stage"></canvas></div>
    <div class="btn-row">
      <button class="ghost" id="run-full">전체 인식</button>
      <button class="primary" id="run-crop" disabled>선택 영역 금액 인식</button>
    </div>
    <div class="progress" id="progress" style="display:none">
      <span id="progress-label">준비 중…</span>
      <div class="bar"><i id="progress-bar"></i></div>
    </div>
  </div>

  <div class="card hidden" id="result-card">
    <label class="field">추정 결과 — 틀리면 직접 고치거나 아래 후보에서 선택</label>
    <div class="result-row"><label>매장명</label><input id="r-store" type="text" placeholder="(못 찾음)" /></div>
    <div class="result-row"><label>금액</label><input id="r-amount" class="num" type="text" inputmode="numeric" placeholder="(못 찾음)" /></div>
    <div class="status" id="amount-status"></div>
    <div class="result-row"><label>날짜</label><input id="r-date" type="text" placeholder="(못 찾음)" /></div>

    <details open>
      <summary>금액 후보</summary>
      <div class="chips" id="cands"></div>
      <div class="meta" id="cand-note"></div>
    </details>
    <details>
      <summary>인식된 전체 텍스트 (마지막 실행)</summary>
      <pre id="raw"></pre>
    </details>
    <div class="meta" id="timing"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const stage = $("stage");
  const sctx = stage.getContext("2d");

  let origImg = null;      // 원본 Image
  let dispScale = 1;       // 원본px / 캔버스px
  let sel = null;          // 캔버스 좌표 { x, y, w, h }
  let lastRaw = "";

  // ── 이미지 로드 & 스테이지 그리기 ─────────────────────────
  $("file").addEventListener("change", async () => {
    const f = $("file").files && $("file").files[0];
    if (!f) return;
    try {
      origImg = await loadImage(f);
      sel = null;
      $("stage-card").classList.remove("hidden"); // 먼저 표시해야 clientWidth 가 잡힘
      layoutStage();
      $("run-crop").disabled = true;
      $("stage-hint").textContent = "선택 없이 “전체 인식”만 눌러도 됩니다.";
    } catch (e) { alert(e.message); }
  });

  function loadImage(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error("이미지를 열 수 없습니다. (아이폰 HEIC 이면 JPG로 저장 후 다시 시도)"));
      img.src = URL.createObjectURL(file);
    });
  }

  function layoutStage() {
    const cssW = stage.parentElement.clientWidth;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const cw = Math.round(cssW * dpr);
    const ch = Math.round((origImg.height / origImg.width) * cw);
    stage.width = cw; stage.height = ch;
    stage.style.height = Math.round(ch / dpr) + "px";
    dispScale = origImg.width / cw;
    drawStage(getPreviewCanvas());
  }
  window.addEventListener("resize", () => { if (origImg) layoutStage(); });

  function getPreviewCanvas() {
    if ($("opt-view").value === "prep") {
      // 미리보기: 전체 이미지를 스테이지 크기로 축소해 전처리
      const c = document.createElement("canvas");
      c.width = stage.width; c.height = stage.height;
      c.getContext("2d").drawImage(origImg, 0, 0, c.width, c.height);
      preprocessInPlace(c, $("opt-prep").value);
      return c;
    }
    return origImg;
  }
  $("opt-view").addEventListener("change", () => origImg && drawStage(getPreviewCanvas()));
  $("opt-prep").addEventListener("change", () => origImg && $("opt-view").value === "prep" && drawStage(getPreviewCanvas()));

  function drawStage(src) {
    sctx.clearRect(0, 0, stage.width, stage.height);
    sctx.drawImage(src, 0, 0, stage.width, stage.height);
    if (sel) {
      sctx.fillStyle = "rgba(10,12,18,0.45)";
      sctx.fillRect(0, 0, stage.width, sel.y);
      sctx.fillRect(0, sel.y + sel.h, stage.width, stage.height - sel.y - sel.h);
      sctx.fillRect(0, sel.y, sel.x, sel.h);
      sctx.fillRect(sel.x + sel.w, sel.y, stage.width - sel.x - sel.w, sel.h);
      sctx.strokeStyle = "#E8503A"; sctx.lineWidth = 2 * (window.devicePixelRatio || 1);
      sctx.strokeRect(sel.x, sel.y, sel.w, sel.h);
    }
  }

  // ── 드래그로 선택 ────────────────────────────────────────
  let dragging = null;
  const posOf = (e) => {
    const r = stage.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * (stage.width / r.width),
      y: (e.clientY - r.top) * (stage.height / r.height),
    };
  };
  stage.addEventListener("pointerdown", (e) => {
    if (!origImg) return;
    try { stage.setPointerCapture(e.pointerId); } catch (_) {}
    const p = posOf(e);
    dragging = { x0: p.x, y0: p.y };
  });
  stage.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const p = posOf(e);
    sel = normRect(dragging.x0, dragging.y0, p.x, p.y);
    drawStage(getPreviewCanvas());
  });
  stage.addEventListener("pointerup", () => {
    dragging = null;
    const ok = sel && sel.w > 12 && sel.h > 8;
    if (!ok) sel = null;
    $("run-crop").disabled = !ok;
    $("stage-hint").textContent = ok
      ? "선택됨 — “선택 영역 금액 인식”을 누르세요. 다시 드래그하면 재선택."
      : "선택 없이 “전체 인식”만 눌러도 됩니다.";
    drawStage(getPreviewCanvas());
  });
  function normRect(x0, y0, x1, y1) {
    return {
      x: Math.max(0, Math.min(x0, x1)),
      y: Math.max(0, Math.min(y0, y1)),
      w: Math.min(stage.width, Math.abs(x1 - x0)),
      h: Math.min(stage.height, Math.abs(y1 - y0)),
    };
  }

  // ── 전처리 ──────────────────────────────────────────────
  function preprocessInPlace(canvas, mode) {
    if (mode === "none") return;
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const w = canvas.width, h = canvas.height;
    const img = ctx.getImageData(0, 0, w, h);
    const px = img.data;
    const gray = new Float32Array(w * h);
    for (let i = 0, j = 0; i < px.length; i += 4, j++) {
      gray[j] = px[i] * 0.299 + px[i + 1] * 0.587 + px[i + 2] * 0.114;
    }
    // 2%~98% 대비 스트레치
    const hist = new Uint32Array(256);
    for (let j = 0; j < gray.length; j++) hist[gray[j] | 0]++;
    let acc = 0, lo = 0, hi = 255;
    for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc > gray.length * 0.02) { lo = v; break; } }
    acc = 0;
    for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc > gray.length * 0.02) { hi = v; break; } }
    const range = Math.max(1, hi - lo);
    for (let j = 0; j < gray.length; j++) gray[j] = Math.max(0, Math.min(255, ((gray[j] - lo) / range) * 255));

    let bin = null;
    if (mode === "otsu") bin = otsu(gray, w, h);
    else if (mode === "sauvola") bin = sauvola(gray, w, h);

    for (let i = 0, j = 0; i < px.length; i += 4, j++) {
      const v = bin ? bin[j] : gray[j];
      px[i] = px[i + 1] = px[i + 2] = v;
    }
    ctx.putImageData(img, 0, 0);
  }

  function otsu(gray, w, h) {
    const total = gray.length;
    const hist = new Uint32Array(256);
    for (let j = 0; j < total; j++) hist[gray[j] | 0]++;
    let sum = 0;
    for (let v = 0; v < 256; v++) sum += v * hist[v];
    let sumB = 0, wB = 0, max = 0, thr = 127;
    for (let v = 0; v < 256; v++) {
      wB += hist[v]; if (!wB) continue;
      const wF = total - wB; if (!wF) break;
      sumB += v * hist[v];
      const mB = sumB / wB, mF = (sum - sumB) / wF;
      const between = wB * wF * (mB - mF) * (mB - mF);
      if (between > max) { max = between; thr = v; }
    }
    const out = new Uint8ClampedArray(total);
    for (let j = 0; j < total; j++) out[j] = gray[j] > thr ? 255 : 0;
    return out;
  }

  // 국소 임계값 (Sauvola) — 적분영상으로 O(1) 윈도우 통계
  function sauvola(gray, w, h) {
    const rad = Math.max(8, Math.round(Math.min(w, h) / 30));
    const k = 0.34, R = 128;
    const iw = w + 1;
    const I = new Float64Array(iw * (h + 1));
    const I2 = new Float64Array(iw * (h + 1));
    for (let y = 1; y <= h; y++) {
      let rs = 0, rs2 = 0;
      const row = (y - 1) * w;
      for (let x = 1; x <= w; x++) {
        const v = gray[row + x - 1];
        rs += v; rs2 += v * v;
        I[y * iw + x] = I[(y - 1) * iw + x] + rs;
        I2[y * iw + x] = I2[(y - 1) * iw + x] + rs2;
      }
    }
    const out = new Uint8ClampedArray(w * h);
    for (let y = 0; y < h; y++) {
      const y0 = Math.max(0, y - rad), y1 = Math.min(h - 1, y + rad);
      for (let x = 0; x < w; x++) {
        const x0 = Math.max(0, x - rad), x1 = Math.min(w - 1, x + rad);
        const area = (x1 - x0 + 1) * (y1 - y0 + 1);
        const a = (x1 + 1) + (y1 + 1) * iw, b = x0 + (y1 + 1) * iw;
        const c = (x1 + 1) + y0 * iw, d = x0 + y0 * iw;
        const sum = I[a] - I[b] - I[c] + I[d];
        const sum2 = I2[a] - I2[b] - I2[c] + I2[d];
        const mean = sum / area;
        const std = Math.sqrt(Math.max(0, sum2 / area - mean * mean));
        const t = mean * (1 + k * (std / R - 1));
        out[y * w + x] = gray[y * w + x] > t ? 255 : 0;
      }
    }
    return out;
  }

  // ── 인식 대상 캔버스 만들기 ──────────────────────────────
  function fullCanvas() {
    const maxSide = 1900;
    const s = Math.min(1, maxSide / Math.max(origImg.width, origImg.height));
    const c = document.createElement("canvas");
    c.width = Math.round(origImg.width * s);
    c.height = Math.round(origImg.height * s);
    const ctx = c.getContext("2d");
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(origImg, 0, 0, c.width, c.height);
    preprocessInPlace(c, $("opt-prep").value);
    return c;
  }

  function cropCanvas(prep) {
    const s = dispScale; // 캔버스px → 원본px
    const sx = sel.x * s, sy = sel.y * s, sw = sel.w * s, sh = sel.h * s;
    // 작은 영역은 크게 확대 (글자 높이 확보), 너무 커지지 않게 상한
    let up = Math.min(2400 / Math.max(sw, sh), Math.max(1, 480 / Math.min(sw, sh)));
    up = Math.max(1, Math.min(up, 5));
    const c = document.createElement("canvas");
    c.width = Math.round(sw * up); c.height = Math.round(sh * up);
    const ctx = c.getContext("2d");
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(origImg, sx, sy, sw, sh, 0, 0, c.width, c.height);
    preprocessInPlace(c, prep || "contrast");
    return c;
  }

  // ── Tesseract worker ────────────────────────────────────
  let worker = null, workerLang = null;
  async function getWorker(lang) {
    if (worker && workerLang === lang) return worker;
    if (worker) { await worker.terminate(); worker = null; }
    $("progress-label").textContent = "OCR 엔진·데이터 다운로드 중… (최초 1회)";
    worker = await Tesseract.createWorker(lang.split("+"), 1, {
      logger: (m) => {
        if (m.status && typeof m.progress === "number") {
          $("progress-label").textContent = m.status + " " + Math.round(m.progress * 100) + "%";
          $("progress-bar").style.width = Math.round(m.progress * 100) + "%";
        }
      },
    });
    workerLang = lang;
    return worker;
  }

  async function recognize(canvas, { psm, digitsOnly } = {}) {
    const w = await getWorker($("opt-lang").value);
    await w.setParameters({
      tessedit_pageseg_mode: psm || $("opt-psm").value,
      // 숫자 전용 패스는 화이트리스트를 최대한 좁혀서(콤마/원/공백만 허용) 다른 문자로
      // 오인식할 여지를 줄인다. "." 은 일부러 뺐다 — 콤마가 마침표로 잘못 나오는 걸 막기 위함.
      tessedit_char_whitelist: digitsOnly ? "0123456789, 원" : "",
      preserve_interword_spaces: "1",
      user_defined_dpi: "300",
    });
    $("progress-label").textContent = "글자 인식 중…";
    const { data } = await w.recognize(canvas);
    return data;
  }

  // ── 숫자 추출 (공용) ─────────────────────────────────────
  // 텍스트에서 "숫자로 보이는 덩어리"를 뽑는다. 콤마/마침표는 천단위 구분자로 관대하게
  // 다루되(11,000 / 11.000 모두 11000), 단독 1~2자리 숫자는 노이즈로 보고 버린다.
  function extractAmounts(text) {
    const chunks = (text || "").split(/[^0-9.,]+/).filter(Boolean);
    const out = [];
    for (const raw of chunks) {
      const clean = raw.replace(/^[.,]+|[.,]+$/g, "");
      if (!clean) continue;
      const grouped = /^\d{1,3}(?:[.,]\d{3})+$/.test(clean);
      let val = null, confident = false;
      if (grouped) {
        val = parseInt(clean.replace(/[.,]/g, ""), 10);
        confident = true;
      } else if (/^\d{3,}$/.test(clean)) {
        val = parseInt(clean, 10);
        confident = false;
      }
      if (val != null && val >= 100 && val < 1e8) out.push({ val, confident });
    }
    return out;
  }

  // ── 파싱 (전체 인식) ─────────────────────────────────────
  function parseFull(text) {
    const lines = text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
    const amountKw = /(합\s*계|총\s*액|결\s*제\s*금?\s*액|받\s*을\s*금?\s*액|판\s*매\s*금?\s*액|승\s*인\s*금?\s*액|청\s*구\s*금?\s*액|총\s*구\s*매|합계금액|total)/i;
    const strongKw = /(합\s*계|결\s*제|승\s*인|받\s*을|청\s*구)/i;
    const excludeKw = /(부\s*가|과\s*세|면\s*세|봉\s*사|포\s*인\s*트|적\s*립|잔\s*액|거\s*스\s*름|현\s*금|받\s*은|공\s*급\s*가|세\s*액)/;
    const candidates = [];
    lines.forEach((l) => {
      if (!amountKw.test(l) || excludeKw.test(l)) return;
      const nums = extractAmounts(l);
      if (!nums.length) return;
      const best = nums.find((n) => n.confident) || nums[nums.length - 1];
      candidates.push({ val: best.val, strong: strongKw.test(l), line: l });
    });
    let amount = null, note = "";
    if (candidates.length) {
      candidates.sort((a, b) => (b.strong - a.strong) || (b.val - a.val));
      amount = candidates[0].val; note = `키워드 "${candidates[0].line}" 에서 인식`;
    } else {
      const allNums = extractAmounts(text).map((n) => n.val);
      if (allNums.length) { amount = Math.max(...allNums); note = "합계 키워드를 못 찾아 가장 큰 금액으로 대체"; }
    }
    let store = null;
    for (const l of lines.slice(0, 6)) {
      const hangul = (l.match(/[가-힣]/g) || []).length;
      const digits = (l.match(/\d/g) || []).length;
      if (hangul >= 2 && digits <= 2 && l.length <= 25) { store = l; break; }
    }
    let date = null;
    const dm = text.match(/20\d{2}\s*[.\-/년]\s*\d{1,2}\s*[.\-/월]\s*\d{1,2}/);
    if (dm) date = dm[0].replace(/\s+/g, "");
    const cands = candidates.length
      ? [...new Set(candidates.map((c) => c.val))].sort((a, b) => b - a)
      : [...new Set(extractAmounts(text).map((n) => n.val))].sort((a, b) => b - a).slice(0, 8);
    return { amount, note, store, date, cands };
  }

  // ── 선택 영역 금액 인식 — 서로 다른 전처리·레이아웃 조합 2가지로 각각 인식하고
  // 결과를 투표로 종합한다("여러 모델"에 준하는 앙상블을 클라이언트 안에서 구현).
  const CROP_PASSES = [
    { label: "Sauvola · 한 줄(PSM7)", prep: "sauvola", psm: "7" },
    { label: "대비 · 블록(PSM6)", prep: "contrast", psm: "6" },
  ];
  async function recognizeCropAmount() {
    const perPass = [];
    const votes = new Map();
    for (let i = 0; i < CROP_PASSES.length; i++) {
      const pass = CROP_PASSES[i];
      $("progress-label").textContent = `영역 인식 중 (${i + 1}/${CROP_PASSES.length}: ${pass.label})…`;
      $("progress-bar").style.width = Math.round((i / CROP_PASSES.length) * 100) + "%";
      const data = await recognize(cropCanvas(pass.prep), { psm: pass.psm, digitsOnly: true });
      const nums = extractAmounts(data.text || "");
      const top = nums.find((n) => n.confident) || nums[0] || null;
      perPass.push({ label: pass.label, text: (data.text || "").trim(), confidence: data.confidence, top: top ? top.val : null });
      nums.forEach((n, idx) => {
        const weight = (n.confident ? 2 : 1) + (idx === 0 ? 1 : 0);
        votes.set(n.val, (votes.get(n.val) || 0) + weight);
      });
    }
    $("progress-bar").style.width = "100%";
    const ranked = [...votes.entries()].sort((a, b) => b[1] - a[1] || b[0] - a[0]).map(([v]) => v);
    const agree = perPass.length === 2 && perPass[0].top != null && perPass[0].top === perPass[1].top;
    const avgConfidence = Math.round(perPass.reduce((s, p) => s + (p.confidence || 0), 0) / (perPass.length || 1));
    const note = !ranked.length
      ? "숫자를 찾지 못했어요 — 영역을 다시 선택하거나 직접 입력해주세요"
      : agree
      ? "2가지 방식의 인식 결과가 일치해요"
      : "인식 결과가 서로 달라요 — 아래 후보를 확인해주세요";
    return { amount: ranked[0] ?? null, cands: ranked, perPass, confidence: avgConfidence, ok: ranked.length > 0, note };
  }

  // ── 결과 표시 ────────────────────────────────────────────
  function setAmountStatus(ok, text) {
    const el = $("amount-status");
    el.textContent = text || "";
    el.className = "status " + (ok ? "ok" : "warn");
  }

  function renderCandidates(cands, picked, note) {
    const cont = $("cands"); cont.innerHTML = "";
    (cands || []).forEach((v) => {
      const el = document.createElement("span");
      el.className = "chip" + (v === picked ? " pick" : "");
      el.textContent = v.toLocaleString("ko-KR") + "원";
      el.onclick = () => {
        $("r-amount").value = v.toLocaleString("ko-KR");
        setAmountStatus(true, "직접 선택함");
        [...cont.children].forEach((c) => c.classList.toggle("pick", c === el));
      };
      cont.appendChild(el);
    });
    $("cand-note").textContent = note || "";
  }

  // ── 실행 ────────────────────────────────────────────────
  async function run(mode) {
    if (!origImg) return;
    $("run-full").disabled = $("run-crop").disabled = true;
    $("progress").style.display = "block";
    $("progress-bar").style.width = "0";
    const t0 = performance.now();
    try {
      if (mode === "crop") {
        const r = await recognizeCropAmount();
        const secs = ((performance.now() - t0) / 1000).toFixed(1);
        if (r.amount != null) $("r-amount").value = r.amount.toLocaleString("ko-KR");
        setAmountStatus(r.ok, r.note);
        renderCandidates(r.cands, r.amount, r.note);
        lastRaw = r.perPass.map((p) => `[${p.label}]\n${p.text || "(빈 결과)"}`).join("\n\n");
        $("raw").textContent = lastRaw;
        $("timing").textContent = `처리 ${secs}s · 신뢰도(평균) ${r.confidence}% · 2가지 방식 비교`;
        $("result-card").classList.remove("hidden");
      } else {
        const data = await recognize(fullCanvas());
        const p = parseFull(data.text || "");
        const secs = ((performance.now() - t0) / 1000).toFixed(1);
        if (p.store != null) $("r-store").value = p.store;
        if (p.amount != null) $("r-amount").value = p.amount.toLocaleString("ko-KR");
        setAmountStatus(p.amount != null, p.amount != null ? p.note : "이번 인식에서 금액을 찾지 못했어요");
        if (p.date != null) $("r-date").value = p.date;
        renderCandidates(p.cands, p.amount, p.note);
        lastRaw = (data.text || "").trim();
        $("raw").textContent = lastRaw || "(빈 결과)";
        $("timing").textContent = `처리 ${secs}s · 신뢰도(평균) ${Math.round(data.confidence)}%`;
        $("result-card").classList.remove("hidden");
      }
      $("progress").style.display = "none";
    } catch (e) {
      $("progress-label").textContent = "오류: " + (e && e.message || e);
      console.error(e);
    } finally {
      $("run-full").disabled = false;
      $("run-crop").disabled = !sel;
    }
  }
  $("run-full").addEventListener("click", () => run("full"));
  $("run-crop").addEventListener("click", () => run("crop"));
})();
</script>
</body>
</html>
