<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>페이지를 찾을 수 없어요 - 딱정산</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin="anonymous" />
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta name="theme-color" content="#EEF1F4" />
<!-- 없는 주소 어디서나 열리므로 자원은 모두 / 로 시작하는 절대 경로 -->
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #EEF1F4; font-family: 'Pretendard', -apple-system, sans-serif; color: #1A1D29; display: flex; justify-content: center; padding: 40px 16px; }
  .card { width: 100%; min-width: 0; max-width: 560px; background: #FFFFFF; box-shadow: 0 18px 40px rgba(26,29,41,0.12), 0 2px 0 rgba(26,29,41,0.04); padding: 40px 32px 44px; text-align: center; }
  .code { font-family: 'Space Grotesk', 'Pretendard', sans-serif; font-size: 48px; font-weight: 800; color: #C7CCD8; margin: 0; letter-spacing: -1px; }
  h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; margin: 6px 0 10px; }
  p { font-size: 14px; line-height: 1.7; color: #4B5165; margin: 0 0 24px; }
  .cta { display: block; padding: 14px 0; background: #E8503A; color: #FFFFFF; font-weight: 700; font-size: 15px; text-decoration: none; border-radius: 4px; }
  .links { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
  .links a { padding: 6px 12px; border: 1px solid #D5D9E2; border-radius: 4px; color: #5C6178; font-size: 12.5px; font-weight: 600; text-decoration: none; }
  .links a:hover { border-color: #9AA0B0; color: #1A1D29; }
</style>
</head>
<body>
  <main class="card">
    <p class="code">404</p>
    <h1>페이지를 찾을 수 없어요</h1>
    <p>주소가 바뀌었거나 없는 페이지예요.<br />딱정산 첫 화면에서 정산·메뉴 추천·미니게임을 바로 쓸 수 있어요.</p>
    <a class="cta" href="/">딱정산으로 가기</a>
    <div class="links">
      <a href="/guide">사용 가이드</a>
      <a href="/how-it-works">정산 계산 방식</a>
      <a href="/contact">문의하기</a>
    </div>
  </main>
</body>
</html>
