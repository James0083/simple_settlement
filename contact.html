<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin="anonymous" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<title>문의하기 - 딱정산</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #EEF1F4;
    font-family: 'Pretendard', -apple-system, sans-serif;
    color: #1A1D29;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: #FFFFFF;
    box-shadow: 0 18px 40px rgba(26,29,41,0.12), 0 2px 0 rgba(26,29,41,0.04);
    padding: 36px 32px 44px;
  }
  .back {
    display: inline-block;
    font-size: 13px;
    color: #9AA0B0;
    text-decoration: none;
    margin-bottom: 20px;
  }
  .back:hover { color: #5C6178; }
  h1 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin: 0 0 10px;
  }
  p {
    font-size: 14px;
    line-height: 1.7;
    color: #4B5165;
    margin: 0 0 28px;
  }
  .cta {
    display: inline-block;
    width: 100%;
    text-align: center;
    box-sizing: border-box;
    padding: 15px 0;
    background: #E8503A;
    color: #FFFFFF;
    font-weight: 700;
    font-size: 15.5px;
    text-decoration: none;
    box-shadow: 2px 3px 0 #B8391F;
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .cta:hover { transform: translateY(-1px); box-shadow: 3px 5px 0 #B8391F; }
  .cta:active { transform: translateY(1px); box-shadow: 1px 2px 0 #B8391F; }
</style>
</head>
<body>
  <div class="card">
    <a class="back" href="index.html">← 딱정산으로 돌아가기</a>
    <h1>문의하기</h1>
    <p>
      딱정산을 쓰면서 불편했던 점, 추가되었으면 하는 기능, 버그 신고 등 어떤 의견이든 좋아요.
      아래 버튼을 누르면 짧은 설문지로 연결돼요.
    </p>
    <a class="cta" href="https://forms.gle/Brsjsgaxka4FaZGHA" target="_blank" rel="noopener">문의 설문지 열기</a>
  </div>
</body>
</html>
